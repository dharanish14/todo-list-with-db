services:
  # Backend API service (Express + Mongoose)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/todo_db}
    depends_on:
      - mongodb
    networks:
      - todo-network

  # Frontend Web Client service (React + Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todo_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - todo-network

  # Local MongoDB Database (fallback when Atlas is not configured)
  mongodb:
    image: mongo:latest
    container_name: todo_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  mongo_data:
